name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme Android (générée à chaque build, pas commitée)
        run: npx cap add android

      - name: Générer les icônes et le splash screen à partir du logo
        run: npx capacitor-assets generate --android

      - name: Synchroniser Capacitor (copie la config vers le projet Android)
        run: npx cap sync android

      - name: Ajouter les permissions Android (caméra, localisation, stockage, notifications)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <uses-feature android:name="android.hardware.location" android:required="false" />\n</manifest>#' "$MANIFEST"
          cat "$MANIFEST"

      - name: Rendre gradlew exécutable
        run: chmod +x android/gradlew

      - name: Copier la config Firebase (notifications push réelles)
        run: cp resources/google-services.json android/app/google-services.json

      - name: Ajouter la configuration de signature (build release, signature stable)
        run: |
          BUILD_GRADLE=android/app/build.gradle
          sed -i 's#android {#android {\n    signingConfigs {\n        release {\n            storeFile file(System.getenv("KEYSTORE_PATH") ?: "nonexistent.keystore")\n            storePassword System.getenv("KEYSTORE_PASSWORD")\n            keyAlias System.getenv("KEY_ALIAS")\n            keyPassword System.getenv("KEY_PASSWORD")\n        }\n    }#' "$BUILD_GRADLE"
          perl -0pi -e 's/(buildTypes \{\s*release \{\s*)minifyEnabled false/\1signingConfig signingConfigs.release\n            minifyEnabled false/' "$BUILD_GRADLE"
          cat "$BUILD_GRADLE"

      - name: Décoder le keystore de signature
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mdm-release.keystore

      - name: Construire l'APK (release, signé)
        env:
          KEYSTORE_PATH: mdm-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: mdm
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: cd android && ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK comme fichier téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: maitre-de-maison-maitre-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
