name: Build APK Android

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis GitHub

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer Java (nécessaire pour Gradle/Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer les dépendances npm
        run: npm install

      - name: Ajouter la plateforme Android (générée à chaque build, pas commitée)
        run: npx cap add android

      - name: Générer les icônes et le splash screen à partir du logo
        run: npx capacitor-assets generate --android

      - name: Synchroniser Capacitor (copie la config vers le projet Android)
        run: npx cap sync android

      - name: Ajouter les permissions Android (caméra, localisation, stockage, notifications)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission
