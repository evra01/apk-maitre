name: Build APK — Espace Maître

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer le SDK Android
        uses: android-actions/setup-android@v3

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Installer Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Pré-configurer Bubblewrap (évite les questions interactives)
        run: |
          mkdir -p ~/.bubblewrap
          cat > ~/.bubblewrap/config.json <<EOF
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ANDROID_HOME}"
          }
          EOF

      - name: Restaurer la clé de signature
        working-directory: android-twa-maitre
        run: echo "${{ secrets.MDM_MAITRE_KEYSTORE_BASE64 }}" | base64 -d > android.keystore

      - name: Générer le projet Android depuis twa-manifest.json
        working-directory: android-twa-maitre
        run: bubblewrap update --skipVersionUpgrade

      - name: Construire l'APK
        working-directory: android-twa-maitre
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.MDM_MAITRE_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.MDM_MAITRE_KEYSTORE_PASSWORD }}
        run: bubblewrap build --skipPwaValidation

      - name: Publier l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: mdm-maitre-apk
          path: android-twa-maitre/app-release-signed.apk
